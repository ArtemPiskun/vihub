name: Обновление и деплой сайта

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Импорт новостей и трендов
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTERNAL_NEWS_URL: ${{ vars.EXTERNAL_NEWS_URL }}
        run: python scripts/ingest.py
      - name: Сохранить контент в репозиторий
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || (git commit -m "content: автообновление" && git push)
      - name: Сборка
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: IndexNow (Яндекс, Bing) после изменений в гайдах
        if: github.event_name == 'push' && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          [ -z "$INDEXNOW_KEY" ] && exit 0
          sleep 30
          curl -s "$SITE_URL/urls.txt" | python3 -c "import sys,json,os; u=[l.strip() for l in sys.stdin if l.strip()]; h=os.environ['SITE_URL'].split('/')[2]; print(json.dumps({'host':h,'key':os.environ['INDEXNOW_KEY'],'urlList':u[:10000]}))" > body.json
          curl -s -X POST https://yandex.com/indexnow -H 'Content-Type: application/json' --data @body.json
          curl -s -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json' --data @body.json
